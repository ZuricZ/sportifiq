name: Send booking reminders

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        user: [ZZ, GV, JJ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve credentials
        run: |
          case "${{ matrix.user }}" in
            ZZ)
              echo "SPORTIFIQ_EMAIL=${{ secrets.ZZ_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.ZZ_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              echo "GMAIL_USER=${{ secrets.ZZ_GMAIL_USER }}" >> "$GITHUB_ENV"
              echo "GMAIL_APP_PASSWORD=${{ secrets.ZZ_GMAIL_APP_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            JJ)
              echo "SPORTIFIQ_EMAIL=${{ secrets.JJ_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.JJ_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              echo "GMAIL_USER=${{ secrets.JJ_GMAIL_USER }}" >> "$GITHUB_ENV"
              echo "GMAIL_APP_PASSWORD=${{ secrets.JJ_GMAIL_APP_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            GV)
              echo "SPORTIFIQ_EMAIL=${{ secrets.GV_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.GV_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              echo "GMAIL_USER=${{ secrets.GV_GMAIL_USER }}" >> "$GITHUB_ENV"
              echo "GMAIL_APP_PASSWORD=${{ secrets.GV_GMAIL_APP_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown user: ${{ matrix.user }}" >&2
              exit 1
              ;;
          esac

      - name: Load user config
        id: cfg
        run: |
          python -c "
          import yaml, os
          with open('config/users.yaml') as f:
              u = yaml.safe_load(f)['users']['${{ matrix.user }}']
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as fh:
              fh.write(f\"notify_email={u['notify_email']}\n\")
              fh.write(f\"venue={u['venue']}\n\")
          "

      - name: Send reminders
        run: |
          python -m src.remind \
            --user_email "$SPORTIFIQ_EMAIL" \
            --notify_email "${{ steps.cfg.outputs.notify_email }}" \
            --user_key "${{ matrix.user }}" \
            --venue "${{ steps.cfg.outputs.venue }}"
        env:
          CANCEL_SECRET: ${{ secrets.CANCEL_SECRET }}
