name: Cancel reservation

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'User key (ZZ, GV, JJ)'
        required: true
      venue:
        description: 'Venue key (koseze, tivoli, svoboda)'
        required: true
      reservation_id:
        description: 'Sportifiq site booking ID (from cancel email link)'
        required: true
      token:
        description: 'HMAC token from cancel email'
        required: true
      exp:
        description: 'Token expiry (Unix timestamp)'
        required: true

jobs:
  cancel:
    runs-on: ubuntu-latest

    env:
      CANCEL_SECRET: ${{ secrets.CANCEL_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve credentials
        run: |
          case "${{ inputs.user }}" in
            ZZ)
              echo "SPORTIFIQ_EMAIL=${{ secrets.ZZ_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.ZZ_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            JJ)
              echo "SPORTIFIQ_EMAIL=${{ secrets.JJ_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.JJ_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            GV)
              echo "SPORTIFIQ_EMAIL=${{ secrets.GV_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.GV_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown user: ${{ inputs.user }}" >&2
              exit 1
              ;;
          esac

      - name: Validate HMAC token
        run: |
          python - <<'EOF'
          import hmac, hashlib, sys, time, os
          secret = os.environ["CANCEL_SECRET"]
          site_id = "${{ inputs.reservation_id }}"
          tok     = "${{ inputs.token }}"
          exp     = int("${{ inputs.exp }}")
          if time.time() > exp:
              sys.exit("Cancel token has expired.")
          payload  = f"{site_id}:{exp}"
          expected = hmac.new(secret.encode(), payload.encode(), hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, tok):
              sys.exit("Invalid cancel token.")
          print("Token valid.")
          EOF

      - name: Cancel booking
        run: |
          python -m src.cancel \
            --venue "${{ inputs.venue }}" \
            --site_id "${{ inputs.reservation_id }}" \
            --user_email "$SPORTIFIQ_EMAIL"
