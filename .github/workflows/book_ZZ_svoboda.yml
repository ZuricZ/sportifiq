name: "ZZ: Book Svoboda (Thursday)"

on:
  schedule:
    - cron: '0 6 * * 4'   # Every Thursday at 06:00 UTC — books 7 days out
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no browser)'
        type: boolean
        default: false

jobs:
  book:
    uses: ./.github/workflows/_book.yml
    with:
      environment: ZZ
      user: ZZ
      venue: svoboda
      day: thursday
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
