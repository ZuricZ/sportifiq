name: _Book court (reusable)

on:
  workflow_call:
    inputs:
      venue:
        required: true
        type: string
      hour:
        required: true
        type: string
      num_sessions:
        type: number
        default: 1
      court_name:
        required: true
        type: string
      backup_court_name:
        type: string
        default: ''
      days_ahead:
        type: number
        default: 7
      dry_run:
        type: boolean
        default: false

jobs:
  book:
    runs-on: ubuntu-latest

    env:
      SPORTIFIQ_PASSWORD: ${{ secrets.SPORTIFIQ_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute target date
        id: date
        run: |
          TARGET=$(python -c "
          from datetime import date, timedelta
          print((date.today() + timedelta(days=${{ inputs.days_ahead }})).isoformat())
          ")
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Book court
        run: |
          python -m src.main \
            --venue "${{ inputs.venue }}" \
            --day "${{ steps.date.outputs.target }}" \
            --hour "${{ inputs.hour }}" \
            --num_sessions "${{ inputs.num_sessions }}" \
            --court_name "${{ inputs.court_name }}" \
            --backup_court_name "${{ inputs.backup_court_name }}" \
            --user_email "${{ secrets.SPORTIFIQ_EMAIL }}"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
