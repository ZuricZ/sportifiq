name: _Book court (reusable)

on:
  workflow_call:
    inputs:
      venue:
        required: true
        type: string
      # --- config-driven path: provide user + day, everything else is read from users.yaml ---
      user:
        type: string
        default: ''
      day:
        description: 'Day of week matching a schedule entry (e.g. monday, wednesday)'
        type: string
        default: ''
      # --- explicit path: provide hour/court directly (ad-hoc / book_manual.yml) ---
      hour:
        type: string
        default: ''
      court_name:
        type: string
        default: ''
      backup_court_name:
        type: string
        default: ''
      # --- shared optional inputs ---
      target_date:
        description: 'ISO date (YYYY-MM-DD) — overrides days_ahead when set'
        type: string
        default: ''
      days_ahead:
        type: number
        default: 7
      execution_time:
        description: 'Sleep until this server time before booking (HH:MM Europe/Berlin)'
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false

jobs:
  book:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve credentials
        run: |
          case "${{ inputs.user }}" in
            ZZ)
              echo "SPORTIFIQ_EMAIL=${{ secrets.ZZ_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.ZZ_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            JJ)
              echo "SPORTIFIQ_EMAIL=${{ secrets.JJ_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.JJ_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            GV)
              echo "SPORTIFIQ_EMAIL=${{ secrets.GV_SPORTIFIQ_EMAIL }}" >> "$GITHUB_ENV"
              echo "SPORTIFIQ_PASSWORD=${{ secrets.GV_SPORTIFIQ_PASSWORD }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown user: ${{ inputs.user }}" >&2
              exit 1
              ;;
          esac

      - name: Resolve booking params
        id: params
        run: |
          if [ -n "${{ inputs.user }}" ] && [ -n "${{ inputs.day }}" ]; then
            python -c "
          import yaml, os
          with open('config/users.yaml', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          user = data['users']['${{ inputs.user }}']
          match = next(
              (s for s in user['schedules']
               if s['venue'].lower() == '${{ inputs.venue }}'.lower()
               and s['day'].lower() == '${{ inputs.day }}'.lower()),
              None
          )
          if not match:
              raise SystemExit('No schedule for user=${{ inputs.user }} venue=${{ inputs.venue }} day=${{ inputs.day }}')
          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as fh:
              fh.write(f\"hour={match['hour']}\n\")
              fh.write(f\"court={match['court']}\n\")
              fh.write(f\"backup={match.get('backup_court', '')}\n\")
          "
          else
            echo "hour=${{ inputs.hour }}" >> "$GITHUB_OUTPUT"
            echo "court=${{ inputs.court_name }}" >> "$GITHUB_OUTPUT"
            echo "backup=${{ inputs.backup_court_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute target date
        id: date
        run: |
          if [ -n "${{ inputs.target_date }}" ]; then
            echo "target=${{ inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            TARGET=$(python -c "
          from datetime import date, timedelta
          print((date.today() + timedelta(days=${{ inputs.days_ahead }})).isoformat())
          ")
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          fi

      - name: Book court
        run: |
          EXEC_TIME="${{ inputs.execution_time }}"
          python -m src.book \
            --venue "${{ inputs.venue }}" \
            --day "${{ steps.date.outputs.target }}" \
            --hour "${{ steps.params.outputs.hour }}" \
            --num_sessions 1 \
            --court_name "${{ steps.params.outputs.court }}" \
            --backup_court_name "${{ steps.params.outputs.backup }}" \
            --user_email "$SPORTIFIQ_EMAIL" \
            ${EXEC_TIME:+--execution_time "$EXEC_TIME"}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
