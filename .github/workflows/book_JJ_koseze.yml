name: "JJ: Book Koseze (Monday)"

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC — books 7 days out
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log only, no browser)'
        type: boolean
        default: false

jobs:
  book:
    uses: ./.github/workflows/_book.yml
    with:
      environment: JJ
      venue: koseze
      hour: "13:00"          # TODO: confirm preferred hour
      num_sessions: 1
      court_name: "BALON HC1"
      backup_court_name: "BALON HC2"
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
