<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancel Court Booking</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 24px;
      background: #fafafa;
    }
    .card p { margin: 6px 0; font-size: 0.95rem; }
    .card .label { color: #666; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .05em; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-cancel { background: #e74c3c; color: white; }
    .btn-cancel:hover { background: #c0392b; }
    .btn-cancel:disabled { background: #aaa; cursor: default; }
    .status { margin-top: 16px; font-size: 0.9rem; }
    .status.ok  { color: #27ae60; }
    .status.err { color: #e74c3c; }
    .expired { color: #e74c3c; font-weight: bold; }
    #pat-section { margin-bottom: 24px; }
    #pat-section label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #444; }
    #pat-input {
      width: 100%; box-sizing: border-box;
      padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px;
      font-size: 0.9rem; font-family: monospace;
    }
    #pat-hint { font-size: 0.78rem; color: #888; margin-top: 4px; }
  </style>
</head>
<body>

<h1>Cancel Court Booking</h1>

<div id="app">Loading…</div>

<script>
  const REPO = "ZuricZ/sportifiq";
  const WORKFLOW = "cancel.yml";
  const BRANCH = "master";

  const params = new URLSearchParams(location.search);
  const siteId = params.get("id");
  const token  = params.get("t");
  const exp    = parseInt(params.get("exp") || "0", 10);
  const user   = params.get("user");

  const app = document.getElementById("app");

  function render() {
    if (!siteId || !token || !exp || !user) {
      app.innerHTML = "<p class='expired'>Invalid link — missing parameters.</p>";
      return;
    }

    const now     = Math.floor(Date.now() / 1000);
    const expired = now > exp;
    const expDate = new Date(exp * 1000).toLocaleString();

    const savedPat = localStorage.getItem("gh_pat") || "";

    app.innerHTML = `
      <div class="card">
        <p class="label">Booking ID</p>
        <p><strong>${siteId}</strong></p>
        <p class="label" style="margin-top:10px">Link expires</p>
        <p ${expired ? 'class="expired"' : ''}>${expDate}${expired ? " — <strong>EXPIRED</strong>" : ""}</p>
      </div>

      <div id="pat-section">
        <label for="pat-input">GitHub Personal Access Token</label>
        <input id="pat-input" type="password" placeholder="github_pat_…" value="${savedPat}" autocomplete="off">
        <p id="pat-hint">
          Needs <code>workflow</code> scope on the <code>${REPO}</code> repo.
          Saved in your browser — you only enter this once.
        </p>
      </div>

      <button class="btn btn-cancel" id="cancel-btn" ${expired ? "disabled" : ""}>
        ${expired ? "Link expired" : "Cancel this booking"}
      </button>
      <div id="status" class="status"></div>
    `;

    document.getElementById("cancel-btn").addEventListener("click", doCancel);
  }

  async function doCancel() {
    const btn    = document.getElementById("cancel-btn");
    const status = document.getElementById("status");
    const pat    = document.getElementById("pat-input").value.trim();

    if (!pat) {
      status.className = "status err";
      status.textContent = "Please enter your GitHub Personal Access Token.";
      return;
    }

    localStorage.setItem("gh_pat", pat);
    btn.disabled = true;
    btn.textContent = "Cancelling…";
    status.textContent = "";

    try {
      const res = await fetch(
        `https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`,
        {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${pat}`,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            ref: BRANCH,
            inputs: {
              user: user,
              reservation_id: siteId,
              token: token,
              exp: String(exp),
            },
          }),
        }
      );

      if (res.status === 204) {
        status.className = "status ok";
        status.textContent = "✓ Cancellation triggered. Check GitHub Actions for progress.";
        btn.textContent = "Cancellation triggered";
      } else {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.message || `HTTP ${res.status}`);
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Cancel this booking";
      status.className = "status err";
      status.textContent = `Error: ${err.message}`;
    }
  }

  render();
</script>
</body>
</html>
